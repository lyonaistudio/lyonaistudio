<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Police du site (Rethink Sans, licence OFL) pour les scripts d'impression :
     sans elle, sharp remplace le texte par une police par défaut.
     Lancer les scripts avec : FONTCONFIG_FILE=scripts/print/fonts/fonts.conf -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir>C:/Windows/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="relative">cache</cachedir>
</fontconfig>
